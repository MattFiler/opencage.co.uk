<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>OpenCAGE</title>

    <!-- The site front door is the documentation. GitHub Pages serves static files only, so this
         has to be a client-side redirect - there is no way to return a real 301 from the repo.
         location.replace runs before the body paints and keeps this page out of the back-button
         history, so Back from /docs/ doesn't bounce straight forward again. The meta refresh is
         the fallback for anything with JavaScript disabled, and the markup below is what shows
         if both are ignored. -->
    <script>window.location.replace("/docs/");</script>
    <meta http-equiv="refresh" content="0; url=/docs/" />
    <link rel="canonical" href="https://opencage.co.uk/docs/" />

    <meta name="description" content="OpenCAGE is an open source set of mod tools for Alien: Isolation." />
    <meta name="keywords" content="opencage, alien isolation, modding, alien isolation mod tools, mod tools, Alien: Isolation, mods, aliens isolation" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="favicon.ico" rel="icon" type="image/x-icon" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@MattFiler" />
    <meta name="twitter:title" content="OpenCAGE" />
    <meta name="twitter:description" content="OpenCAGE is an open source set of mod tools for Alien: Isolation." />
    <meta name="twitter:image" content="https://opencage.co.uk/docs/preview.png" />
    <meta property="og:image" content="https://opencage.co.uk/docs/preview.png" />

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        html, body {
            padding: 0; margin: 0; border: 0;
            min-height: 100vh;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Montserrat', sans-serif;
            text-align: center;
            color: #fff;
            background-color: #412b69;
            background-image:
                repeating-linear-gradient(-45deg, transparent 0, transparent 40px, #000 40px, #000 80px),
                linear-gradient(45deg, #412b69 0%, #8e1073 100%);
            text-shadow: 0 0 20px rgba(0, 0, 0, 0.84);
        }
        .redirect_inner {
            width: 100%;
            max-width: 600px;
            padding: 20px;
        }
        img {
            display: block;
            width: calc(100% - 30px);
            max-width: 420px;
            height: auto;
            margin: 0 auto 30px;
            object-fit: contain;
            filter: drop-shadow(0 0 20px rgba(0, 0, 0, 0.55));
        }
        p {
            font-size: 18px;
            line-height: 1.5;
        }
        a {
            color: #fff;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="redirect_inner">
        <img src="logo_trim_smaller.png" alt="OpenCAGE">
        <p>Taking you to the documentation&hellip;</p>
        <p>If nothing happens, <a href="/docs/">continue to the OpenCAGE documentation</a>.</p>
    </div>

    <script async src="https://www.googletagmanager.com/gtag/js?id=UA-39768980-14"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'UA-39768980-14');
    </script>
    <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "Project",
            "name": "OpenCAGE",
            "url": "http://opencage.co.uk",
            "logo": "http://opencage.co.uk/icon.png",
            "sameAs": "https://github.com/MattFiler/OpenCAGE"
        }
    </script>
    <script type="application/ld+json">
        {
            "@context": "http://schema.org",
            "@type": "BreadcrumbList",
            "itemListElement": [
                {
                    "@type": "ListItem",
                    "position": "0",
                    "item": {
                        "@id": "http://opencage.co.uk/",
                        "name": "OpenCAGE"
                    }
                },
                {
                    "@type": "ListItem",
                    "position": "1",
                    "item": {
                        "@id": "http://opencage.co.uk/docs",
                        "name": "OpenCAGE Documentation"
                    }
                }
            ]
        }
    </script>
</body>
</html>
